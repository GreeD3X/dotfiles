# Toggle mouse with ^N; then report it's new status
bind C-n set -g mouse \; display 'Mouse #{?mouse,on,off}'

# Basic setup for fast config-reload
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ── General Settings ─────────────────────
set -g history-limit 15000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Default color settings                    
set -g default-terminal "tmux-256color"
                    
set -ga terminal-overrides ",*256col*:Tc"


# ── TPM Plugin Manager ───────────────────
# Install TPM first: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Keep the run line at the very bottom of this file.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

#set -g @plugin 'egel/tmux-gruvbox'
set -g @plugin 'dracula/tmux'
                            
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'


                            
# ---- Theme decoration -----------
#set -g @tmux-gruvbox 'dark' # or 'dark256', 'light', 'light256''
#set -g @tmux-gruvbox-left-status-a '#S' # tmux's session name
#set -g @tmux-gruvbox-right-status-x '%Y.%m.%d' # e.g.: 2024.01.30
#set -g @tmux-gruvbox-right-status-y '%H:%M' # 21:54 
#set -g @tmux-gruvbox-right-status-z '#h #{tmux_mode_indicator}'
set -g @dracula-plugins "cpu-usage ram-usage time"
set -g @dracula-show-powerline true
set -g @dracula-show-left-icon "#h | #S"
set -g @dracula-time-format "%F %R"

# Automatic session save/restore and time(minutes) between saves                            
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'



run '~/.tmux/plugins/tpm/tpm'
